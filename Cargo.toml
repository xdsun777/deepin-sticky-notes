[package]
name = "deepin-sticky-notes"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.13"
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
global-hotkey = "0.8"

[build-dependencies]
slint-build = "1.13"
